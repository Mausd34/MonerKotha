services:
  - type: web
    name: monerkotha
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: monerkotha-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: monerkotha-ratelimits
          property: connectionString
      - key: ALLOWED_HOSTS
        value: monerkotha.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"
  - type: keyvalue
    name: monerkotha-ratelimits
    plan: free
    maxmemoryPolicy: allkeys-lru
databases:
  - name: monerkotha-db
    plan: free
